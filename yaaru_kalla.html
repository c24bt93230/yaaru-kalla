let state={caseIndex:0,case:null,score:1000,time:300,found:[],selected:null,ended:false,timer:null};

function app(){return document.getElementById("app")}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function home(){
 clearTimer();
 app().innerHTML=`<div class="screen home">
 <div class="detective">🕵️</div><h1>ಯಾರು ಕಳ್ಳ?</h1>
 <div class="subtitle">KANNADA DETECTIVE GAME</div>
 <h2>ನಿಮ್ಮ ಪ್ರಕರಣವನ್ನು ಆಯ್ಕೆ ಮಾಡಿ</h2>
 <div class="case-grid">${CASES.map((c,i)=>`<button class="case-card ${["blue","green","purple","orange"][i]}" onclick="startCase(${i})">CASE ${i+1}<br><br>${c.title}<br><br>★ ${c.difficulty}<br><br>▶ PLAY</button>`).join("")}</div>
 </div>`
}
function clearTimer(){if(state.timer){clearInterval(state.timer);state.timer=null}}
function startCase(i){
 state={caseIndex:i,case:CASES[i],score:1000,time:300,found:[],selected:null,ended:false,timer:null};
 renderGame(); state.timer=setInterval(tick,1000);
}
function renderGame(){
 const c=state.case;
 app().innerHTML=`<div class="game">
 <header class="header"><h1>🕵️ ${c.title}</h1><div id="score" class="stat">🏆 1000</div><div id="timer" class="stat timer">⏱️ 05:00</div></header>
 <main class="main">
  <aside class="left"><h2>📖 ಪ್ರಕರಣ</h2><div class="intro">${esc(c.intro)}</div>
   <div id="clueCount" class="clue-count">🔎 ಸುಳಿವುಗಳು: 0 / ${c.clues.length}</div>
   <button class="btn purplebtn" onclick="findClue()">🔎 ಸುಳಿವು ಹುಡುಕಿ</button>
   <button class="btn darkbtn" onclick="caseFile()">📋 CASE FILE</button>
  </aside>
  <section class="right"><h2>👥 ಶಂಕಿತರನ್ನು ಆಯ್ಕೆ ಮಾಡಿ</h2><div class="hint">👇 ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಮೇಲೆ CLICK ಮಾಡಿ ಪ್ರಶ್ನೆ ಕೇಳಿ</div>
   <div class="suspects">${c.suspects.map((s,i)=>`<button class="suspect" onclick="selectSuspect(${i})"><span class="icon">${s.icon}</span>${s.name}<br>${s.role}<br><br>▶ ಪ್ರಶ್ನಿಸಿ</button>`).join("")}</div>
   <div id="dialogue" class="dialogue">👆 ಮೊದಲು ಒಬ್ಬ ಶಂಕಿತನನ್ನು ಆಯ್ಕೆ ಮಾಡಿ.</div>
   <h2>❓ ಪ್ರಶ್ನೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ</h2><div id="questions" class="questions"></div>
  </section>
 </main>
 <footer class="bottom"><button class="btn red" onclick="accuse()">🚨 FINAL ACCUSATION</button><button class="btn grey" onclick="home()">🏠 CASE MENU</button></footer>
 </div>`;
}
function selectSuspect(i){
 if(state.ended)return;
 state.selected=i; const s=state.case.suspects[i];
 document.getElementById("dialogue").textContent=`${s.icon} ${s.name} — ${s.role}\n\nಈ ವ್ಯಕ್ತಿಗೆ ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳನ್ನು ಕೇಳಿ.`;
 document.getElementById("questions").innerHTML=s.questions.map((q,i)=>`<button class="question" onclick="ask(${i})">${i+1}. ${q[0]}<br>▶ ಪ್ರಶ್ನೆ ಕೇಳಿ</button>`).join("");
}
function ask(i){
 if(state.ended)return;
 const s=state.case.suspects[state.selected]; state.score=Math.max(0,state.score-10); updateStats();
 document.getElementById("dialogue").textContent=`❓ ಪ್ರಶ್ನೆ:\n${s.questions[i][0]}\n\n💬 ಉತ್ತರ:\n“${s.questions[i][1]}”`;
}
function findClue(){
 if(state.ended)return;
 if(state.found.length>=state.case.clues.length){alert("ನೀವು ಎಲ್ಲಾ ಸುಳಿವುಗಳನ್ನು ಕಂಡುಹಿಡಿದಿದ್ದೀರಿ!");return}
 const i=state.found.length; state.found.push(i); state.score+=75; updateStats();
 const [icon,title,desc]=state.case.clues[i];
 document.getElementById("clueCount").textContent=`🔎 ಸುಳಿವುಗಳು: ${state.found.length} / ${state.case.clues.length}`;
 document.getElementById("dialogue").textContent=`${icon} ಹೊಸ ಸುಳಿವು!\n\n🔎 ${title}\n\n${desc}`;
}
function caseFile(){
 const c=state.case;
 let t=`📋 ${c.title}\n\n🔎 ಕಂಡ ಸುಳಿವುಗಳು: ${state.found.length} / ${c.clues.length}\n\n🏆 ಸ್ಕೋರ್: ${state.score}\n\n`;
 t+=state.found.length?state.found.map(i=>`${c.clues[i][0]} ${c.clues[i][1]}\n${c.clues[i][2]}`).join("\n\n"):"ಇನ್ನೂ ಯಾವುದೇ ಸುಳಿವು ಕಂಡಿಲ್ಲ.";
 modal("📋 CASE FILE",`<div class="toast">${esc(t)}</div>`);
}
function accuse(){
 if(state.ended)return;
 const c=state.case;
 modal("🚨 ಯಾರು ಕಳ್ಳ?",`<p>ಒಬ್ಬ ಶಂಕಿತನನ್ನು ಆಯ್ಕೆ ಮಾಡಿ</p>${c.suspects.map((s,i)=>`<label class="radio"><input type="radio" name="acc" value="${i}"> ${s.icon} ${s.name} — ${s.role}</label>`).join("")}<button class="btn red" onclick="confirmAccuse()">🚨 CONFIRM ACCUSATION</button>`);
}
function confirmAccuse(){
 const checked=document.querySelector('input[name="acc"]:checked');
 if(!checked){alert("ಮೊದಲು ಒಬ್ಬ ಶಂಕಿತನನ್ನು ಆಯ್ಕೆ ಮಾಡಿ.");return}
 const i=Number(checked.value), name=state.case.suspects[i].name;
 closeModal(); state.ended=true; clearTimer();
 if(name===state.case.answer){state.score+=500;updateStats(); modal("🎉 ಪ್ರಕರಣ ಪರಿಹಾರ!",`<div class="toast">🎉 ಸರಿಯಾದ ಉತ್ತರ!\\n\\n🕵️ ಕಳ್ಳ: ${state.case.answer}\\n\\n${state.case.ending}\\n\\n🏆 FINAL SCORE: ${state.score}</div><button class="btn grey" onclick="closeModal();home()">🏠 CASE MENU</button>`)}
 else modal("❌ ತಪ್ಪು ಆರೋಪ!",`<div class="toast">ನೀವು ${name} ಎಂದು ಆಯ್ಕೆ ಮಾಡಿದ್ದೀರಿ.\\n\\n❌ ಅದು ತಪ್ಪು!\\n\\nನಿಜವಾದ ಕಳ್ಳ: ${state.case.answer}\\n\\n${state.case.ending}</div><button class="btn grey" onclick="closeModal();home()">🏠 CASE MENU</button>`);
}
function modal(title,body){
 const old=document.querySelector(".overlay");if(old)old.remove();
 const d=document.createElement("div");d.className="overlay";d.id="modal";d.innerHTML=`<div class="modal"><h2>${title}</h2>${body}</div>`;document.body.appendChild(d);
}
function closeModal(){const m=document.getElementById("modal");if(m)m.remove()}
function updateStats(){document.getElementById("score").textContent=`🏆 ${state.score}`}
function tick(){
 if(state.ended)return; state.time--; const m=Math.floor(state.time/60),s=state.time%60;const el=document.getElementById("timer");
 if(!el)return;el.textContent=`⏱️ ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;el.classList.toggle("danger",state.time<=30);
 if(state.time<=0){state.ended=true;clearTimer();modal("⏰ ಸಮಯ ಮುಗಿದಿದೆ!",`<div class="toast">ನಿಮ್ಮ ಸಮಯ ಮುಗಿದಿದೆ!\\n\\nನಿಜವಾದ ಕಳ್ಳ: ${state.case.answer}</div><button class="btn grey" onclick="closeModal();home()">🏠 CASE MENU</button>`)}
}
home();
</script>
